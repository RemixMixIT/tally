# tally — self-host docker-compose
#
# Run:
#   1. `cp apps/api/.env.example .env` and fill in values
#   2. `docker compose up -d --build`
#   3. open http://localhost:3001 (put a TLS reverse proxy in front for remote access)
#
# For zero-trust + the MCP OIDC connector, also bring up the IdP:
#   `docker compose -f docker-compose.yml -f docker-compose.idp.yml up -d`

services:
  tally:
    # Build context is the repo ROOT (the Dockerfile COPYs apps/web and apps/api).
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: tally:local
    container_name: tally
    restart: unless-stopped
    ports:
      # Bound to localhost — put a TLS reverse proxy (Caddy/Traefik) in front for remote access.
      - "127.0.0.1:3001:3001"
    volumes:
      - tally-data:/app/data
      # Batty CSV + Vanquis / Capital on Tap PDFs copied here by host rclone
      # (scripts/sync-tally-valuation-feed.sh, scripts/sync-tally-vanquis-statements.sh,
      #  scripts/sync-tally-capital-on-tap-statements.sh).
      # Dropbox drop → inbound; OneDrive is the archive after import.
      - ./data/inbound:/app/inbound:ro
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3001/healthz"]
      interval: 60s
      timeout: 5s
      start_period: 15s
      retries: 3
    # Local receipt OCR (tesseract) needs more than the API's idle footprint.
    mem_limit: 512m
    # Runtime hardening — drop all Linux capabilities and forbid privilege escalation.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - default
      - immich

volumes:
  tally-data:

# Immich is published on the host loopback only. The receipt poller reaches it
# by container name on Immich's network: TALLY_IMMICH_BASE_URL=http://immich_server:2283
networks:
  immich:
    name: immich_default
    external: true
